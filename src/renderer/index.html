<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaFen Radio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>

    <!-- 液态玻璃：边缘折射位移滤镜 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2.2" result="soft-noise" />
        <feDisplacementMap in="SourceGraphic" in2="soft-noise" scale="46" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="liquid-glass-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.014" numOctaves="2" seed="11" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1.6" result="soft-noise" />
        <feDisplacementMap in="SourceGraphic" in2="soft-noise" scale="22" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
  </body>
</html>
